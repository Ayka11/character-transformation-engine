name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Verify local backend package resolution
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from cte.longitudinal import longitudinal_change; import cte.longitudinal as m; print(m.__file__); print(longitudinal_change([2,4],[3,6]).relative_change); assert longitudinal_change([2,4],[3,6]).relative_change == 0.5"
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -m pytest -q
