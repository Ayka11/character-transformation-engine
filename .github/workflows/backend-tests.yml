name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Verify local backend package resolution
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "from cte.longitudinal import longitudinal_change; import cte.longitudinal as m; print(m.__file__); print(longitudinal_change([2,4],[3,6]).relative_change); assert longitudinal_change([2,4],[3,6]).relative_change == 0.5"
      - name: Collect backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          set +e
          python -m pytest --collect-only -q > /tmp/pytest-collect.txt 2>&1
          rc=$?
          cat /tmp/pytest-collect.txt
          exit $rc
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -m pytest -vv --timeout=120 --durations=20 --maxfail=1
      - name: Check Science Lab UI JavaScript
        run: node --check frontend/app.js
      - name: Verify v2.6 RC gate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          GITHUB_SHA: ${{ github.sha }}
        run: python backend/scripts/verify_rc_gate.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Run PostgreSQL integration test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          CTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cte
        run: |
          python -m pytest -vv --timeout=120 --durations=20 --maxfail=1 backend/tests/test_postgres_integration.py
      - name: Rehearse PostgreSQL migration and rollback
        run: |
          python -m pip install psycopg[binary]
          python - <<'PY'
          import psycopg
          from pathlib import Path
          admin="postgresql://postgres:postgres@localhost:5432/postgres"
          rehearsal="postgresql://postgres:postgres@localhost:5432/cte_migration_rehearsal"
          with psycopg.connect(admin, autocommit=True) as conn:
              conn.execute("DROP DATABASE IF EXISTS cte_migration_rehearsal")
              conn.execute("CREATE DATABASE cte_migration_rehearsal")
          up=Path("backend/migrations/002_runtime_postgres.sql").read_text()
          down=Path("backend/migrations/002_runtime_postgres.down.sql").read_text()
          with psycopg.connect(rehearsal, autocommit=True) as conn:
              conn.execute(up)
              tables={row[0] for row in conn.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")}
              assert {"runtime_snapshots","runtime_events"}.issubset(tables)

              # A populated database must reject the destructive down migration.
              conn.execute(
                  "INSERT INTO runtime_snapshots "
                  "(namespace, key, version, payload_json, payload_hash) "
                  "VALUES (%s, %s, %s, %s::jsonb, %s)",
                  ("rollback-guard-test", "sentinel", "1", '{"preserve": true}', "sentinel-hash"),
              )
              try:
                  conn.execute(down)
              except psycopg.Error as exc:
                  assert "Refusing destructive rollback" in str(exc), str(exc)
                  # The down migration opens an explicit transaction; clear its
                  # aborted transaction before checking that the sentinel survived.
                  conn.execute("ROLLBACK")
              else:
                  raise AssertionError("down migration unexpectedly accepted populated runtime tables")

              tables={row[0] for row in conn.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")}
              assert {"runtime_snapshots","runtime_events"}.issubset(tables), tables
              sentinel=conn.execute(
                  "SELECT payload_json FROM runtime_snapshots "
                  "WHERE namespace=%s AND key=%s",
                  ("rollback-guard-test", "sentinel"),
              ).fetchone()
              assert sentinel is not None and sentinel[0] == {"preserve": True}, sentinel

              # Prove the event-only populated case is also protected. This
              # catches a guard that accidentally checks snapshots but ignores events.
              conn.execute(
                  "DELETE FROM runtime_snapshots WHERE namespace=%s AND key=%s",
                  ("rollback-guard-test", "sentinel"),
              )
              conn.execute(
                  "INSERT INTO runtime_events "
                  "(event_id, namespace, event_type, payload_json, input_hash, output_hash, provenance_record_id) "
                  "VALUES (%s, %s, %s, %s::jsonb, %s, %s, %s)",
                  ("rollback-guard-event", "rollback-guard-test", "SENTINEL",
                   '{"preserve": true}', "input-sentinel", "output-sentinel", "rollback-guard"),
              )
              try:
                  conn.execute(down)
              except psycopg.Error as exc:
                  assert "Refusing destructive rollback" in str(exc), str(exc)
                  conn.execute("ROLLBACK")
              else:
                  raise AssertionError("down migration unexpectedly accepted populated runtime_events")

              tables={row[0] for row in conn.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")}
              assert {"runtime_snapshots","runtime_events"}.issubset(tables), tables
              event=conn.execute(
                  "SELECT payload_json FROM runtime_events WHERE event_id=%s",
                  ("rollback-guard-event",),
              ).fetchone()
              assert event is not None and event[0] == {"preserve": True}, event

              # Remove the sentinel only after proving the guard preserved it;
              # then verify that rollback succeeds for an empty rehearsal DB.
              conn.execute(
                  "DELETE FROM runtime_events WHERE event_id=%s",
                  ("rollback-guard-event",),
              )
              conn.execute(down)
              tables={row[0] for row in conn.execute("SELECT table_name FROM information_schema.tables WHERE table_schema='public'")}
              assert "runtime_snapshots" not in tables and "runtime_events" not in tables
          PY
