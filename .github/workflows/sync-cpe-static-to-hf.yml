name: Sync CPE Static Space to Hugging Face

on:
  push:
    branches: [hf-static-space]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Aygun1489/character-transformation-engine
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
